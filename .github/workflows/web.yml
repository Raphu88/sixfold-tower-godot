# Builds the web version of the game and publishes it to GitHub Pages
# every time main changes. Play it at https://raphu88.github.io/sixfold-tower-godot/
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  # The smoke test, split across machines that run side by side: "core" is
  # everything in tests/smoke_test.gd but the part files, and the part files
  # (tests/parts) are dealt out over the shards. Every test still runs before
  # anything is published; the build just waits for the slowest machine
  # instead of for all of them one after another.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tests:
          - "core"
          - "parts shard=0/5"
          - "parts shard=1/5"
          - "parts shard=2/5"
          - "parts shard=3/5"
          - "parts shard=4/5"
    name: test (${{ matrix.tests }})
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot and web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz 'templates/web_nothreads_*' -d "$dest"
          echo "${GODOT_VERSION}.stable" > "$dest/version.txt"
          rm /tmp/templates.tpz

      - name: Import assets and run the smoke test
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          # (--import waits until every sound and file is imported, then quits)
          timeout 300 $godot --headless --import || true
          timeout 300 $godot --headless --editor --quit || true
          # Some checks build random floors and can rarely draw an unlucky layout.
          # A real bug fails every time, so one failed run gets one more try; the
          # first run's failures stay in the log.
          if ! timeout 2400 $godot --headless -s tests/smoke_test.gd -- ${{ matrix.tests }}; then
            echo "::warning::The smoke test (${{ matrix.tests }}) failed once; running it again"
            timeout 2400 $godot --headless -s tests/smoke_test.gd -- ${{ matrix.tests }}
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot and web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz 'templates/web_nothreads_*' -d "$dest"
          echo "${GODOT_VERSION}.stable" > "$dest/version.txt"
          rm /tmp/templates.tpz

      - name: Import assets
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          timeout 300 $godot --headless --import || true
          timeout 300 $godot --headless --editor --quit || true

      - name: Export for web
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p build/web
          timeout 300 $godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
